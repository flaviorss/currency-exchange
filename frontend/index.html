<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Currency Exchange</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/58/58266.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon"><i class="bi bi-arrow-left-right"></i></span>
        Currency Exchange
      </div>
      <nav class="menu">
        <div class="menu-title">MENU</div>
        <a href="index.html" class="active"><i class="bi bi-arrow-left-right"></i> Conversor</a>
        <a href="rest.html"><i class="bi bi-activity"></i> REST</a>
        <a href="soap.html"><i class="bi bi-bar-chart-line"></i> SOAP</a>
      </nav>
    </aside>
 
    <main class="content">
      <h1 class="page-title">Conversor de moedas</h1>
      <p class="page-sub">Compare as conversões utilizando REST e SOAP.</p>
 
      <section class="card-x">
        <h2>Realizar conversão</h2>
        <label for="valor" class="form-label">Valor</label>
        <input id="valor" type="text" inputmode="decimal" class="form-control amount mb-3" value="1.000,00">
 
        <div class="row g-3 align-items-end mb-4">
          <div class="col">
            <label for="de" class="form-label">De</label>
            <select id="de" class="form-select"></select>
          </div>
          <div class="col-auto">
            <button type="button" class="swap" id="trocar" aria-label="Inverter moedas"><i class="bi bi-arrow-left-right"></i></button>
          </div>
          <div class="col">
            <label for="para" class="form-label">Para</label>
            <select id="para" class="form-select"></select>
          </div>
        </div>
 
        <button type="button" id="converter" class=" btn-convert w-100">Converter</button>
      </section>
 
      <h2 class="section-title">Comparação dos resultados</h2>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card-x result-card rest">
            <span class="badge-api badge badge-rest">REST</span>
            <div class="result-value" id="rest-valor">—</div>
            <div class="meta"><span>Tempo</span><strong id="rest-tempo">—</strong></div>
            <div class="meta"><span>Cotação</span><strong id="rest-cotacao">—</strong></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card-x result-card soap">
            <span class="badge-api badge badge-soap">SOAP</span>
            <div class="result-value" id="soap-valor">—</div>
            <div class="meta"><span>Tempo</span><strong id="soap-tempo">—</strong></div>
            <div class="meta"><span>Cotação</span><strong id="soap-cotacao">—</strong></div>
          </div>
        </div>
        <div class="col-12">
          <div class="card-x">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <div>
                <div class="form-label mb-1">Diferença entre os serviços</div>
                <div class="diff-value" id="diferenca">—</div>
              </div>
              <span class="fast" id="mais-rapido"></span>
            </div>
            <small class="text-secondary d-block mt-2">Valores e tempos ilustrativos.</small>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
