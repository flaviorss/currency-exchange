<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Currency Exchange</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/58/58266.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon"><i class="bi bi-arrow-left-right"></i></span>
        Currency Exchange
      </div>
      <nav class="menu">
        <div class="menu-title">MENU</div>
        <a href="index.html" class="active"><i class="bi bi-arrow-left-right"></i> Conversor</a>
      </nav>
    </aside>
 
    <main class="content">
      <h1 class="page-title">Conversor de moedas</h1>
      <p class="page-sub">Compare as conversões utilizando REST e SOAP.</p>
 
      <form class="card-x" id="conversionForm">
        <h2>Realizar conversão</h2>
        <label for="amount" class="form-label">Valor</label>
        <input id="amount" type="number" min="0.01" step="any" class="form-control amount mb-3" value="100" placeholder="Digite o valor" required>
 
        <div class="row g-3 align-items-end mb-4">
          <div class="col">
            <label for="from" class="form-label">De</label>
            <select id="from" class="form-select" required>
              <option value="USD" selected>USD</option>
              <option value="EUR">EUR</option>
              <option value="CNY">CNY</option> <!-- Yuan chinês -->
              <option value="GBP">GBP</option> <!-- Libra Esterlina  -->
              <option value="RUB">RUB</option> <!-- Rublo Russo -->
              <option value="QAR">QAR</option> <!-- Rial Catarense -->
            </select>
          </div>
          <div class="col-auto">
            <button type="button" class="swap" id="trocar" aria-label="Inverter moedas"><i class="bi bi-arrow-left-right"></i></button>
          </div>
          <div class="col">
            <label for="to" class="form-label">Para</label>
            <select id="to" class="form-select" required>
              <option value="USD">USD</option>
              <option value="EUR" selected>EUR</option>
              <option value="CNY">CNY</option> <!-- Yuan chinês -->
              <option value="GBP">GBP</option> <!-- Libra Esterlina  -->
              <option value="RUB">RUB</option> <!-- Rublo Russo -->
              <option value="QAR">QAR</option> <!-- Rial Catarense -->
            </select>
          </div>
        </div>
 
        <button type="submit" id="converter" class=" btn-convert w-100">Converter</button>
      </form>
 
      <h2 class="section-title">Comparação dos resultados</h2>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card-x result-card rest">
            <span class="badge-api badge badge-rest">REST</span>
            <div class="result-value" id="rest-valor">—</div>
            <div class="meta"><span>Tempo</span><strong id="rest-tempo">—</strong></div>
            <div class="meta"><span>Cotação</span><strong id="rest-cotacao">—</strong></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card-x result-card soap">
            <span class="badge-api badge badge-soap">SOAP</span>
            <div class="result-value" id="soap-valor">—</div>
            <div class="meta"><span>Tempo</span><strong id="soap-tempo">—</strong></div>
            <div class="meta"><span>Cotação</span><strong id="soap-cotacao">—</strong></div>
          </div>
        </div>
        <div class="col-12">
          <div class="card-x">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <div>
                <div class="form-label mb-1">Diferença entre os serviços</div>
                <div class="diff-value" id="diferenca">—</div>
              </div>
              <span class="fast" id="mais-rapido"></span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/converter.js" defer></script>
  <script src="js/converterSOAP.js" defer></script>
</body>
</html>
